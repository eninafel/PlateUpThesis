# Runs MySQL and the PHP API together:   docker compose up --build
# API: http://localhost:8000/api/health
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: plateup
      MYSQL_USER: plateup_app
      MYSQL_PASSWORD: ${DB_PASS:-plateup_pass}
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    ports:
      - "8000:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: plateup
      DB_USER: plateup_app
      DB_PASS: ${DB_PASS:-plateup_pass}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Manila}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-60}
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
